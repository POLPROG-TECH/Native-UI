name: Deploy Storybook

# Deploys only after the CI workflow passed for a push to the default branch,
# so the published docs never come from a commit with failing checks.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI verified; a manual run uses the selected ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The published Introduction / Dashboard show real test and coverage numbers.
      - name: Jest report for the docs stats
        run: npm run test:report --workspace=@polprog/native-ui
      - run: npm run build-storybook
        env:
          # "View source" links on component pages open the exact deployed commit.
          STORYBOOK_SOURCE_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/storybook/storybook-static

  deploy:
    name: GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
