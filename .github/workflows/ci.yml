name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@polprog/native-ui
      - name: Tests and stories type-check too
        run: npm run typecheck:all --workspace=@polprog/native-ui
      - name: Storybook app type-check
        run: npm run typecheck --workspace=@polprog/storybook
      - name: Public API report is up to date
        run: npm run api:check --workspace=@polprog/native-ui

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ci --workspace=@polprog/native-ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: packages/native-ui/coverage

  stories-check:
    name: Story Coverage
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run stories:check --workspace=@polprog/native-ui

  import-cycles:
    name: Architecture (import cycles)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:cycles --workspace=@polprog/native-ui

  build:
    name: Build Library
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@polprog/native-ui
      - name: Verify publish tarball contents
        run: npm run verify-tarball --workspace=@polprog/native-ui
      - uses: actions/upload-artifact@v7
        with:
          name: native-ui-dist
          path: packages/native-ui/dist

  audit-deps:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --yes audit-ci --config ./audit-ci.jsonc

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    # Reuses the Jest report from `test` for the docs stats instead of rerunning Jest.
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Jest report for the docs stats (tests and coverage on Introduction / Dashboard)
        uses: actions/download-artifact@v7
        with:
          name: coverage
          path: packages/native-ui/coverage
      - run: npm run build-storybook
      - name: Enforce Storybook bundle-size budget
        run: npm run bundle-size --workspace=@polprog/storybook
      - uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/storybook/storybook-static

  storybook-tests:
    name: Storybook tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      # Mirrors THEME_MATRIX in apps/storybook/.storybook/globals/themeMatrix.ts.
      matrix:
        project: [storybook, storybook-dark, storybook-rtl, storybook-large-contrast]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run every story as a Vitest browser test (render, play, axe)
        run: npm run test:themes --workspace=@polprog/storybook -- --project=${{ matrix.project }}

  chromatic:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: build-storybook
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Jest report for the docs stats, so snapshots match the published Storybook
        uses: actions/download-artifact@v7
        with:
          name: coverage
          path: packages/native-ui/coverage
      - uses: chromaui/action@latest
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          workingDir: .
          exitZeroOnChanges: true
          exitOnceUploaded: true
