name: Release

# Runs only after the CI workflow passed for a push to the default branch, so a
# commit that fails any CI job (types, lint, tests, Storybook, package checks)
# can never be versioned or published.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit CI verified, not whatever the branch points at now.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build --workspace=@polprog/native-ui
      - name: Verify publish tarball contents and exports map
        run: npm run verify-tarball --workspace=@polprog/native-ui
      - name: Lint the package (publint, are-the-types-wrong)
        run: npm run package:lint --workspace=@polprog/native-ui
      - name: Create Release PR or publish to npm
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          version-script: npm run version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
